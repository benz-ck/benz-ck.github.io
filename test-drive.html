<body data-page="testdrive">

<nav class="nav" id="nav" aria-label="주 메뉴"></nav>

<main>
  <header class="phero">
    <div class="wrap">
      <nav class="crumb" aria-label="현재 위치"><a href="index.html">홈</a><span>상담 · 계산기</span></nav>
      <p class="phero__k">Test Drive</p>
      <h1>시승 예약 — <em>인천전시장</em></h1>
      <p class="phero__lede">타 보고 싶은 차와 편한 날짜를 남겨 주세요. 시승 가능한 차량과 시간을 확인해서 연락드립니다.</p>
    </div>
  </header>
  <section class="sec" id="req" data-toc="시승 예약">
    <div class="wrap calc">
      <form class="box form" id="reqForm" data-kind="drive" onsubmit="return false">
        <div class="fld"><label for="qModel">차종</label><select class="sel" id="qModel"></select></div>
        <div class="fld"><label for="qDate">희망 날짜 <span class="opt">(선택)</span></label><input class="inp" type="date" id="qDate"></div>
        <div class="fld"><span class="lbl">희망 시간대 <span class="opt">(선택 · 여러 개 가능)</span></span>
          <div class="checks">
            <label class="chk"><input type="checkbox" name="time" value="오전">오전</label>
            <label class="chk"><input type="checkbox" name="time" value="오후">오후</label>
            <label class="chk"><input type="checkbox" name="time" value="늦은 오후">늦은 오후</label>
            <label class="chk"><input type="checkbox" name="time" value="주말">주말</label>
          </div></div>
        <div class="row2">
          <div class="fld"><label for="qName">성함</label><input class="inp" id="qName" autocomplete="name" placeholder="성함을 적어 주세요"></div>
          <div class="fld"><label for="qPhone">연락처 <span class="opt">(선택)</span></label><input class="inp" id="qPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="문자로 보내시면 안 적으셔도 돼요"></div>
        </div>
        <div class="fld"><label for="qMemo">문의 내용 <span class="opt">(선택)</span></label>
          <textarea class="txt" id="qMemo" placeholder="원하시는 색상, 같이 타 볼 차, 궁금한 점 등"></textarea></div>
      </form>
      <aside class="box result">
        <p class="res__k">보낼 내용 미리보기</p>
        <textarea class="msg" id="qMsg" readonly aria-label="보낼 내용"></textarea>
        <div class="send">
          <a class="btn btn--white" id="qSms" href="sms:01031130328">문자로 보내기</a>
          <a class="btn btn--kakao" id="qKakao" href="https://open.kakao.com/o/s35suoRh" target="_blank" rel="noopener">카카오톡으로 보내기 (내용 복사됨)</a>
          <a class="btn btn--line" href="tel:01031130328">전화로 바로 상담 010-3113-0328</a>
        </div>
        <p class="fine">입력하신 내용은 이 홈페이지에 저장되지 않고, 버튼을 누르실 때 문자나 카카오톡으로만 전달됩니다. 문자 보내기는 휴대폰에서 열립니다. 컴퓨터에서는 카카오톡이나 전화를 이용해 주세요.</p>
      </aside>
    </div>
  </section>
</main>
